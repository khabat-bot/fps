<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Web Multiplayer FPS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #joystick-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
      }

      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
        touch-action: none;
      }

      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 30;
        color: #e5e7eb;
        font-family: monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 6px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting…</div>
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
