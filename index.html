<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Web Multiplayer FPS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #joystick-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
      }

      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
        touch-action: none;
      }

      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 25;
        pointer-events: none;
      }
      #fire-btn {
        position: absolute;
        right: 20px;
        bottom: 100px;
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        z-index: 25;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        user-select: none;
      }
      #fire-btn:active {
        background: rgba(255, 255, 255, 0.4);
      }
      #hit-flash {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 0, 0, 0.3);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 40;
      }
      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 30;
        color: #e5e7eb;
        font-family: monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 6px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hit-flash"></div>
    <div id="crosshair"></div>
    <div id="status">Starting…</div>
    <div id="fire-btn">FIRE</div>
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
