<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Web Multiplayer FPS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #joystick-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
      }

      #look-zone {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        z-index: 20;
        pointer-events: auto;
        touch-action: none;
      }

      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 25;
        pointer-events: none;
      }
      #fire-btn {
        position: absolute;
        right: 20px;
        bottom: 100px;
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        z-index: 25;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        user-select: none;
      }
      #fire-btn:active {
        background: rgba(255, 255, 255, 0.4);
      }
      #hit-flash {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 0, 0, 0.3);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 40;
      }
      #health-hud {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        color: #22c55e;
        font-family: monospace;
        font-size: 24px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 16px;
        border-radius: 8px;
        pointer-events: none;
      }
      #scoreboard {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 30;
        color: #e5e7eb;
        font-family: monospace;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 8px 12px;
        border-radius: 4px;
        pointer-events: none;
      }
      #death-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(100, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #death-overlay.active {
        opacity: 1;
      }
      #death-overlay h1 {
        color: white;
        font-size: 48px;
        margin: 0 0 16px 0;
        text-transform: uppercase;
        letter-spacing: 4px;
      }
      #death-overlay p {
        color: #fca5a5;
        font-size: 18px;
        font-family: monospace;
      }
      #lobby-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(17, 24, 39, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        color: #e5e7eb;
        font-family: sans-serif;
      }
      #lobby-overlay h1 {
        font-size: 32px;
        margin-bottom: 8px;
        color: #22c55e;
      }
      #lobby-overlay p {
        font-size: 14px;
        margin-bottom: 16px;
        color: #9ca3af;
      }
      #room-code-input {
        padding: 12px 16px;
        font-size: 18px;
        border: 2px solid #374151;
        border-radius: 8px;
        background: #1f2937;
        color: white;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
        width: 200px;
      }
      #room-code-input:focus {
        outline: none;
        border-color: #22c55e;
      }
      #join-btn {
        padding: 12px 32px;
        font-size: 16px;
        font-weight: bold;
        background: #22c55e;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #join-btn:hover {
        background: #16a34a;
      }
      #join-btn:disabled {
        background: #4b5563;
        cursor: not-allowed;
      }
      #lobby-error {
        margin-top: 16px;
        font-size: 14px;
        min-height: 20px;
        color: #ef4444;
      }
      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 30;
        color: #e5e7eb;
        font-family: monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.35);
        padding: 4px 6px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="lobby-overlay">
      <h1>Web FPS</h1>
      <p>Enter a room code to play with friends, or leave blank for a random room.</p>
      <input type="text" id="room-code-input" placeholder="e.g., A1B2C3" maxlength="6">
      <button id="join-btn">JOIN / CREATE</button>
      <p id="lobby-error"></p>
    </div>
    <div id="hit-flash"></div>
    <div id="death-overlay"><h1>You Died</h1><p>Respawning...</p></div>
    <div id="health-hud">HP: 100</div>
    <div id="scoreboard">K: 0 | D: 0</div>
    <div id="crosshair"></div>
    <div id="status">Starting…</div>
    <div id="fire-btn">FIRE</div>
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
